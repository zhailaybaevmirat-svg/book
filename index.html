<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><title>Астрономия үйі</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#060a1c;--ink:#e8ecff;--gold:#f5c542;--pan:#0e1535}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#16204a,#060a1c 70%);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;overflow-x:hidden}
#house{width:min(96vw,920px);margin:14px auto;transform-origin:left center;transition:transform 1.1s ease,opacity .6s ease .6s;perspective:1200px}
#house.open{transform:rotateY(-100deg);opacity:0}
.roof{background:linear-gradient(#0c1233,#18224f);clip-path:polygon(50% 0,100% 100%,0 100%);height:150px;margin:0 -2%;display:flex;align-items:flex-end;justify-content:center;border-bottom:4px solid var(--gold)}
.roof div{text-align:center;padding:0 0 12px}
.roof h1{margin:0;font-size:clamp(18px,4.5vw,36px);letter-spacing:2px}
.roof p{margin:2px 0 0;font-size:clamp(10px,2vw,14px);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;background:#0a0f28;border:3px solid #2b3566}
.win{position:relative;min-height:clamp(120px,24vw,200px);border:3px solid var(--gold);border-radius:6px;cursor:pointer;overflow:hidden;background:#0b1130;transition:transform .25s,box-shadow .25s;color:inherit;font:inherit;padding:0}
.win:hover,.win:focus-visible{transform:scale(1.03);box-shadow:0 0 22px #f5c54299;outline:none}
.win b{position:absolute;left:6px;right:6px;top:6px;background:#f5c542dd;color:#222;font-size:clamp(10px,2vw,14px);padding:3px 6px;border-radius:4px;text-align:center}
.win i{position:absolute;inset:0;display:block}
.g1 i{background:radial-gradient(circle at 25% 60%,#ffb02e 0 14%,#ff7a00 16%,transparent 18%),radial-gradient(circle at 50% 66%,#5aa0ff 0 4%,transparent 5%),radial-gradient(circle at 62% 66%,#d9774a 0 3%,transparent 4%),radial-gradient(circle at 76% 64%,#e8c07a 0 6%,transparent 7%),radial-gradient(circle at 90% 66%,#6fd0e6 0 4%,transparent 5%)}
.g2 i{background:conic-gradient(from 0deg at 50% 58%,#7b5bff,#ffd6ff,#4a6bff,#7b5bff);-webkit-mask:radial-gradient(ellipse 40% 22% at 50% 58%,#000 30%,transparent 70%);mask:radial-gradient(ellipse 40% 22% at 50% 58%,#000 30%,transparent 70%)}
.g3 i{background:radial-gradient(circle at 50% 60%,#fff 0 3%,#8aa 6%,transparent 40%),radial-gradient(circle at 20% 30%,#fff 0 1%,transparent 2%),radial-gradient(circle at 80% 80%,#fff 0 1%,transparent 2%),radial-gradient(circle at 75% 35%,#fff 0 1%,transparent 2%)}
.g4 i{background:radial-gradient(circle at 25% 40%,#fff 0 2%,transparent 3%),radial-gradient(circle at 45% 55%,#fff 0 2%,transparent 3%),radial-gradient(circle at 60% 40%,#fff 0 2%,transparent 3%),radial-gradient(circle at 78% 62%,#fff 0 2%,transparent 3%),radial-gradient(circle at 50% 75%,#fff 0 2%,transparent 3%)}
.g5 i{background:radial-gradient(ellipse at 40% 60%,#ff4f9a99,transparent 50%),radial-gradient(ellipse at 62% 55%,#4fa6ff99,transparent 50%)}
.door{border-color:#ffd77a;animation:glow 2s infinite alternate}
.door i{background:radial-gradient(ellipse at 50% 70%,#ffe39a,#7b5bff55 60%,transparent);display:flex;align-items:center;justify-content:center;font-size:clamp(34px,8vw,64px)}
@keyframes glow{to{box-shadow:0 0 28px #ffd77acc}}
.base{background:#050814;border:3px solid #2b3566;border-top:0;text-align:center;padding:10px;font-size:clamp(11px,2vw,15px);color:#b9c3ff}
#book{position:fixed;inset:0;display:none;background:radial-gradient(ellipse at top,#16204a,#060a1c 70%);padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:8px}
#book.show{display:flex}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bar button,.nav button{background:var(--pan);color:var(--ink);border:1px solid #3a4780;border-radius:6px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.bar button.on{background:var(--gold);color:#222;border-color:var(--gold)}
.spread{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.2fr;gap:8px;max-width:1100px;width:100%;margin:0 auto}
.pg{background:#101840;border:2px solid #2b3566;border-radius:8px;padding:16px;overflow:auto}
.pg small{color:var(--gold)}
.pg h2{margin:4px 0 10px;font-size:clamp(20px,4vw,30px)}
.pg p{line-height:1.55;font-size:15px}

.pg a{color:#7fc4ff}
#cv{padding:0;position:relative;overflow:hidden;background:#02040c}
#cv span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:12px;color:#8fa0e0;pointer-events:none}
#cv canvas{display:block;width:100%;height:100%;touch-action:none}
.nav{display:flex;justify-content:center;align-items:center;gap:12px}
@media(max-width:700px){.spread{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:16px;background:radial-gradient(ellipse at top,#16204a,#060a1c 70%);z-index:5;transition:opacity .8s}
#gate.out{opacity:0;pointer-events:none}
#gate h1{margin:0;font-size:clamp(24px,6vw,48px);letter-spacing:3px}
#gate p{margin:0;color:var(--gold)}
.dw{width:min(60vw,220px);height:min(85vw,320px);perspective:900px;position:relative;cursor:pointer;background:#05081a;padding:0;border-radius:110px 110px 0 0;box-shadow:inset 0 0 40px #7b5bff,0 0 30px #f5c54266;border:6px solid var(--gold)}
.dw .lf,.dw .in{position:absolute;inset:0;border-radius:100px 100px 0 0}
.dw .in{background:radial-gradient(circle,#fff 0 1%,#7b5bff 8%,#0b1236 60%)}
.dw .lf{background:linear-gradient(135deg,#1b2766,#0b1236);transform-origin:left center;transition:transform 1.2s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;border-right:3px solid var(--gold)}
.dw .lf:after{content:'';width:14px;height:14px;border-radius:50%;background:var(--gold)}
.dw.op .lf{transform:rotateY(-110deg)}
figure img{width:100%;max-height:220px;object-fit:cover;border-radius:6px;display:block}
figcaption{font-size:11px;color:#8fa0e0;margin-top:4px}
</style></head><body>

function tex(a,b,t){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');x.fillStyle=a;x.fillRect(0,0,256,128);x.globalAlpha=.55;for(let i=0;i<(t=='band'?16:70);i++){x.fillStyle=t=='band'?(i%2?b:a):b;if(t=='band')x.fillRect(0,Math.random()*128,256,4+Math.random()*10);else{x.beginPath();x.arc(Math.random()*256,Math.random()*128,3+Math.random()*16,0,7);x.fill()}}return new THREE.CanvasTexture(c)}
function sph(r,col,col2,t,emit){const m=emit?new THREE.MeshBasicMaterial({map:tex(col,col2,t)}):new THREE.MeshStandardMaterial({map:tex(col,col2,t),roughness:.9});return new THREE.Mesh(new THREE.SphereGeometry(r,48,32),m)}
function pts(arr,col,size){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));if(col)g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return new THREE.Points(g,new THREE.PointsMaterial({size,vertexColors:!!col,color:col?0xffffff:0xffffff,transparent:true,opacity:.9,depthWrite:false}))}
function model(s){const g=new THREE.Group(),R=Math.random;
if(s[0]=='p'){const m=sph(s[4],s[1],s[2],s[3],s[6]);g.add(m);if(s[6]){const h=new THREE.Mesh(new THREE.SphereGeometry(s[4]*1.25,32,24),new THREE.MeshBasicMaterial({color:0xff9a1a,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(h)}
if(s[5]){const r=new THREE.Mesh(new THREE.RingGeometry(s[4]*1.35,s[4]*(s[5]==1?2.3:1.8),96),new THREE.MeshBasicMaterial({color:s[5]==1?0xcdb98a:0x9fdde6,side:2,transparent:true,opacity:s[5]==1?.8:.4}));r.rotation.x=s[5]==1?1.25:0.1;if(s[5]==2)r.rotation.y=1.4;g.add(r)}}
else if(s[0]=='sys'){g.add(sph(.5,'#ffb52e','#ff6a00','blob',1));g.add(new THREE.Mesh(new THREE.SphereGeometry(.62,24,16),new THREE.MeshBasicMaterial({color:0xff9a1a,transparent:true,opacity:.2,blending:THREE.AdditiveBlending,depthWrite:false})));g.add(new THREE.PointLight(0xffffff,1.6,0));g.userData.orb=[];[['#8d8680',.07,.9,2.4],['#e5c07b',.11,1.2,1.9],['#1f5fbf',.12,1.55,1.6],['#c1502e',.09,1.9,1.3],['#d9b38c',.3,2.5,.8],['#e3cf9a',.25,3.05,.6],['#8fe3e6',.18,3.55,.42],['#3b5de0',.18,4,.33]].forEach((p,i)=>{const pv=new THREE.Group();pv.rotation.y=i*1.3;const m=new THREE.Mesh(new THREE.SphereGeometry(p[1],24,16),new THREE.MeshStandardMaterial({color:p[0]}));m.position.x=p[2];pv.add(m);g.add(pv);g.userData.orb.push([pv,p[3]*.01]);const o=new THREE.Mesh(new THREE.RingGeometry(p[2]-.005,p[2]+.005,128),new THREE.MeshBasicMaterial({color:0x6f8cff,side:2,transparent:true,opacity:.35}));o.rotation.x=Math.PI/2;g.add(o);if(i==5){const r=new THREE.Mesh(new THREE.RingGeometry(.34,.5,48),new THREE.MeshBasicMaterial({color:0xcdb98a,side:2,transparent:true,opacity:.8}));r.rotation.x=1.2;m.add(r)}});g.rotation.x=.9}
else if(s[0]=='gal'){const a=[],c=[],A=new THREE.Color(s[1]),B=new THREE.Color(s[2]);for(let i=0;i<9000;i++){const r=Math.pow(R(),.6)*3.4,arm=i%4,ang=r*1.7+arm*Math.PI/2+(R()-.5)*(.5+.25*r);const h=(R()-.5)*.3*Math.exp(-r*.5);a.push(Math.cos(ang)*r,h,Math.sin(ang)*r);const k=new THREE.Color().copy(A).lerp(B,r/3.4);c.push(k.r,k.g,k.b)}g.add(pts(a,c,.035));g.rotation.x=.9}
else if(s[0]=='uni'){const a=[],c=[],B=new THREE.Color(s[1]);for(let i=0;i<7000;i++){const u=R()*6.283,v=Math.acos(2*R()-1),r=Math.cbrt(R())*3.3;const f=1+.25*Math.sin(u*5)*Math.sin(v*4);a.push(r*f*Math.sin(v)*Math.cos(u),r*f*Math.cos(v),r*f*Math.sin(v)*Math.sin(u));const k=new THREE.Color(0xffffff).lerp(B,R());c.push(k.r,k.g,k.b)}g.add(pts(a,c,.04))}
else if(s[0]=='con'){const P3=s[1].map(p=>new THREE.Vector3(...p));P3.forEach((p,i)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.09,16,12),new THREE.MeshBasicMaterial({color:i%3?0xffffff:0xffe6a0}));m.position.copy(p);g.add(m)});const l=[];s[2].forEach(e=>l.push(P3[e[0]],P3[e[1]]));g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(l),new THREE.LineBasicMaterial({color:0x6f8cff})));const sc=3/Math.max(...P3.map(p=>Math.abs(p.x)),1);g.scale.setScalar(Math.min(1.2,sc*.9))}
else{const a=[],c=[],A=new THREE.Color(s[1]),B=new THREE.Color(s[2]);for(let i=0;i<6000;i++){const x=(R()+R()+R()-1.5)*2.4,y=(R()+R()+R()-1.5)*1.8,z=(R()+R()+R()-1.5)*2.4;a.push(x,y,z);const k=new THREE.Color().copy(A).lerp(B,Math.min(1,Math.abs(x+y*.5)/1.6)).multiplyScalar(.5+R()*.5);c.push(k.r,k.g,k.b)}g.add(pts(a,c,.06));const st=[];for(let i=0;i<40;i++)st.push((R()-.5)*3,(R()-.5)*2,(R()-.5)*3);g.add(pts(st,null,.09))}
return g}
function init(){const h=$('cv');renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));h.appendChild(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,1,.1,100);camera.position.z=5;scene.add(new THREE.AmbientLight(0xffffff,.55));const d=new THREE.DirectionalLight(0xffffff,1);d.position.set(5,3,5);scene.add(d);const bg=[];for(let i=0;i<800;i++){const v=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(40);bg.push(v.x,v.y,v.z)}scene.add(pts(bg,null,.12));
const cv=renderer.domElement;cv.onpointerdown=e=>{drag=1;px=e.clientX;py=e.clientY};addEventListener('pointerup',()=>drag=0);addEventListener('pointermove',e=>{if(drag&&grp){grp.rotation.y+=(e.clientX-px)*.01;grp.rotation.x+=(e.clientY-py)*.01;px=e.clientX;py=e.clientY}});cv.addEventListener('wheel',e=>{e.preventDefault();camera.position.z=Math.min(14,Math.max(2,camera.position.z+e.deltaY*.005))},{passive:false});
addEventListener('resize',rs);rs();(function loop(){requestAnimationFrame(loop);if(grp&&grp.userData.orb){grp.userData.orb.forEach(o=>o[0].rotation.y+=o[1])}else if(grp&&!drag)grp.rotation.y+=.004;renderer.render(scene,camera)})()}
function rs(){if(!renderer)return;const h=$('cv'),w=h.clientWidth,t=h.clientHeight;if(!w||!t)return;renderer.setSize(w,t);camera.aspect=w/t;camera.updateProjectionMatrix()}
function show(i){cur=Math.max(0,Math.min(P.length-1,i));const p=P[cur];$('tx').innerHTML='<small>'+CH[p[0]]+'</small><h2>'+p[1]+'</h2><figure id="fg" style="margin:0 0 10px"></figure><p>'+p[2]+'</p><ul>'+p[3].split('|').map(x=>'<li>'+x+'</li>').join('')+'</ul><p><a href="'+N+p[5]+'" target="_blank" rel="noopener">NASA сайтында қарау ↗</a></p>';
if(grp)scene.remove(grp);grp=model(p[4]);scene.add(grp);camera.position.z=p[4][0]=='p'?4.2:(p[4][0]=='sys'?9:5.5);$('ct').textContent=(cur+1)+' / '+P.length;[...$('chs').children].forEach((b,k)=>b.classList.toggle('on',k==p[0]));rs();loadImg(cur)}
const Q=['solar system planets','Sun Solar Dynamics Observatory','Mercury MESSENGER','Venus Magellan','Earth Blue Marble','Moon full','Mars Perseverance','Jupiter Juno','Saturn Cassini','Uranus Voyager 2','Neptune Voyager 2','Milky Way galaxy','Sagittarius A* black hole','Planck cosmic microwave background','dark matter Hubble','Ursa Major constellation','Orion constellation','Cassiopeia constellation','Orion Nebula Hubble','Crab Nebula','Ring Nebula Hubble'],cache={};
async function loadImg(i){const f=$('fg');if(!f)return;try{if(!(i in cache)){const r=await fetch('https://images-api.nasa.gov/search?media_type=image&q='+encodeURIComponent(Q[i]));const j=await r.json();const it=j.collection.items.find(x=>x.links&&x.links[0]);cache[i]=it?{u:it.links[0].href.replace('http://','https://'),t:it.data[0].title}:null}if(i!=cur)return;const c=cache[i];f.textContent='';if(c){const im=new Image();im.src=c.u;im.alt=c.t;const cp=document.createElement('figcaption');cp.textContent=c.t+' — NASA Image and Video Library';f.append(im,cp)}}catch(e){if(i==cur)f.innerHTML='<small>Сурет жүктелмеді (интернетті тексеріңіз)</small>'}}
$('dw').onclick=()=>{$('dw').classList.add('op');setTimeout(()=>{$('house').style.display='block';$('gate').classList.add('out')},1300);setTimeout(()=>$('gate').style.display='none',2200)};
CH.forEach((n,k)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(P.findIndex(p=>p[0]==k));$('chs').appendChild(b)});
function openBook(c){$('house').classList.add('open');setTimeout(()=>{$('book').classList.add('show');if(!renderer)init();show(P.findIndex(p=>p[0]==c))},900)}
document.querySelectorAll('.win').forEach(b=>b.onclick=()=>openBook(+b.dataset.c));
$('pv').onclick=()=>show(cur-1);$('nx').onclick=()=>show(cur+1);
$('home').onclick=()=>{$('book').classList.remove('show');$('house').classList.remove('open')};
addEventListener('keydown',e=>{if($('book').classList.contains('show')){if(e.key=='ArrowRight')show(cur+1);if(e.key=='ArrowLeft')show(cur-1)}});
